# Data is stored in a file (./data/studentdb.mv.db) so it survives restarts.
spring.datasource.url=jdbc:h2:file:./data/studentdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Browse the database at http://localhost:8080/h2-console (JDBC URL as above, user sa, no password)
spring.h2.console.enabled=true
